name: Publish to edge on merged PR

on:
  pull_request_target:
    branches:
      - snap-1.10
  schedule:
    # Run on the first Sunday of the month at 02:00 UTC
    - cron: '0 2 1-7 * SUN'

jobs:
  publish_to_edge:
    # self-hosted runner so we can access launchpad
    runs-on: [self-hosted, x64, linux, spread-enabled]
    environment: store
    steps:
      - name: Publish to edge
        env:
          LP_CREDENTIALS: ${{ secrets.LP_CREDENTIALS }}
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        uses: snapcore/system-snaps-cicd-tools/action-publish-edge@main
