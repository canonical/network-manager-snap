    override-build: |
      set -ex
      "/build/network-manager-snap-26/stage"/build-tools/check-versions dnsmasq-base no
      git apply "/build/network-manager-snap-26"/snap-patch/dnsmasq.patch
      craftctl default
      # Strip binaries
      find "$CRAFT_PART_INSTALL"/ -executable -type f | xargs file -Ni |
          grep 'application/x-.*executable\|application/x-.*sharedlib' | cut -d: -f1 | xargs strip
    prime:
